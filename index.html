<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIN PAR - Dashboard & Búsqueda con IA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LIBRERÍAS DE INTELIGENCIA ARTIFICIAL (TensorFlow.js + MobileNet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- CABECERA -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg">
          <i class="fa-solid fa-gem text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">SIN PAR</h1>
          <p class="text-xs text-indigo-300">Escáner Visual con Inteligencia Artificial</p>
        </div>
      </div>
      
      <button onclick="cargarDatos()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg transition flex items-center space-x-2">
        <i id="btn-refresh-icon" class="fa-solid fa-rotate-right"></i>
        <span>Sincronizar</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow space-y-6 w-full">

    <!-- PANEL DE BÚSQUEDA Y FOTO -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Búsqueda Inteligente</h2>
          <p class="text-xs text-slate-500">Tómale una foto al producto físico para que la IA busque su precio y stock exacto.</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <!-- Entrada de Texto -->
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar por SKU (Ej: JOY-045)..." 
            class="pl-3 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            onkeyup="filtrarTablaTexto()"
          >

          <!-- Botón Tomar/Subir Foto -->
          <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 cursor-pointer transition shadow-md">
            <i class="fa-solid fa-robot"></i>
            <span>ESCANEAR CON IA</span>
            <input type="file" accept="image/*" capture="environment" id="imageUploader" class="hidden" onchange="analizarYBuscarImagen(event)">
          </label>
        </div>
      </div>

      <!-- PREVISUALIZACIÓN Y RESULTADO DE LA FOTO CON IA -->
      <div id="image-preview-container" class="hidden bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center space-x-4">
        <img id="uploaded-img-preview" src="" class="w-20 h-20 object-cover rounded-lg border border-slate-300">
        <div>
          <p id="match-status" class="text-xs font-bold uppercase"></p>
          <p id="match-detail" class="text-sm text-slate-600 mt-1"></p>
          <button onclick="limpiarFiltroImagen()" class="text-xs text-rose-600 hover:underline mt-2 flex items-center">
            <i class="fa-solid fa-xmark mr-1"></i> Quitar filtro y mostrar todo
          </button>
        </div>
      </div>

      <!-- TABLA DE RESULTADOS -->
      <div class="overflow-x-auto custom-scrollbar border border-slate-200 rounded-lg">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider font-semibold">
              <th class="p-3.5">Vista Previa</th>
              <th class="p-3.5">SKU / ID</th>
              <th class="p-3.5">Categoría</th>
              <th class="p-3.5">Nombre del Producto</th>
              <th class="p-3.5 text-right">Precio Venta</th>
              <th class="p-3.5 text-center">Stock</th>
            </tr>
          </thead>
          <tbody id="inventoryTable" class="divide-y divide-slate-200 text-sm">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-2"></i>
                <p>Cargando inventario desde Google Sheets...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // PEGA AQUÍ TU URL EJECUTABLE DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbyTzwkLsW3uOcm3D55jKIcJZ4TejrltUXFWQLJQZhb5KtR78bXkh7yifoYtRBhRtbyb/exec"; 
    
    let inventarioGlobal = [];
    let netModel = null;

    // Cargar el modelo de IA en segundo plano
    async function cargarModeloIA() {
      try {
        netModel = await mobilenet.load();
        console.log("Motor de Inteligencia Artificial Listo");
      } catch (err) {
        console.error("Error al cargar la IA:", err);
      }
    }
    cargarModeloIA();

    // Cargar datos desde Google Sheets
    async function cargarDatos() {
      const btnIcon = document.getElementById('btn-refresh-icon');
      if (btnIcon) btnIcon.classList.add('fa-spin');

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        inventarioGlobal = data.items || [];
        renderTabla(inventarioGlobal);
      } catch (err) {
        console.error("Error al cargar el inventario:", err);
      } finally {
        if (btnIcon) btnIcon.classList.remove('fa-spin');
      }
    }

    // Renderizar la tabla en HTML
    function renderTabla(items) {
      const tbody = document.getElementById('inventoryTable');
      if (!items || items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">
              No se encontró ningún producto coincidente.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const sku = item["SKU / ID"] || "-";
        const cat = item["Categoría"] || "General";
        const nombre = item["Nombre del Producto"] || "Sin Nombre";
        const precio = item["Precio Venta (PEN)"] || 0;
        const stock = item["Stock Inicial"] || 0;
        const imgUrl = item["Imagen"] || item["Imagen "] || "https://via.placeholder.com/60?text=Sin+Foto";

        const precioFormateado = (typeof precio === 'number') 
          ? `S/ ${precio.toFixed(2)}` 
          : String(precio);

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3.5">
              <img src="${imgUrl}" class="w-12 h-12 object-cover rounded-lg border border-slate-200" onerror="this.src='https://via.placeholder.com/60?text=Sin+Foto'">
            </td>
            <td class="p-3.5 font-mono text-xs font-bold text-indigo-600">${sku}</td>
            <td class="p-3.5 text-xs text-slate-600">${cat}</td>
            <td class="p-3.5 font-medium text-slate-800">${nombre}</td>
            <td class="p-3.5 text-right font-bold text-emerald-700">${precioFormateado}</td>
            <td class="p-3.5 text-center font-semibold text-slate-700">${stock}</td>
          </tr>
        `;
      }).join('');
    }

    // MOTOR DE BÚSQUEDA POR FOTO CON INTELIGENCIA ARTIFICIAL
    async function analizarYBuscarImagen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const container = document.getElementById('image-preview-container');
      const previewImg = document.getElementById('uploaded-img-preview');
      const statusText = document.getElementById('match-status');
      const matchDetail = document.getElementById('match-detail');

      previewImg.src = URL.createObjectURL(file);
      container.classList.remove('hidden');
      statusText.textContent = "IA Analizando rasgos de la foto...";
      statusText.className = "text-xs font-bold text-indigo-600 uppercase";
      matchDetail.textContent = "";

      const nombreArchivo = file.name.toLowerCase().replace(/\.[^/.]+$/, "").trim();

      // 1. INTENTO POR CÓDIGO DIRECTO O ARCHIVO
      let coincidencia = inventarioGlobal.filter(item => {
        const sku = String(item["SKU / ID"] || '').toLowerCase().trim();
        const imgUrl = String(item["Imagen"] || item["Imagen "] || '').toLowerCase().trim();
        return (sku && (nombreArchivo.includes(sku) || sku.includes(nombreArchivo))) || (imgUrl && imgUrl.includes(nombreArchivo));
      });

      // 2. SI NO HAY COINCIDENCIA DE ARCHIVO, USAR IA PARA DETECTAR EL PRODUCTO
      if (coincidencia.length === 0) {
        if (!netModel) netModel = await mobilenet.load();

        previewImg.onload = async () => {
          const predictions = await netModel.classify(previewImg);
          const tagDetectado = predictions[0] ? predictions[0].className.toLowerCase() : "";
          const palabrasClave = tagDetectado.split(',').map(p => p.trim());

          // Buscar coincidencia visual por IA en Nombre o Categoría
          coincidencia = inventarioGlobal.filter(item => {
            const nombre = String(item["Nombre del Producto"] || '').toLowerCase();
            const cat = String(item["Categoría"] || '').toLowerCase();
            return palabrasClave.some(p => nombre.includes(p) || cat.includes(p));
          });

          if (coincidencia.length > 0) {
            statusText.textContent = "¡PRODUCTO IDENTIFICADO CON IA!";
            statusText.className = "text-xs font-bold text-emerald-600 uppercase";
            matchDetail.textContent = `IA detectó la forma de: "${tagDetectado.split(',')[0]}".`;
            renderTabla([coincidencia[0]]); // Muestra SOLO el producto encontrado
          } else {
            statusText.textContent = "NO SE ENCONTRÓ PRODUCTO";
            statusText.className = "text-xs font-bold text-rose-600 uppercase";
            matchDetail.textContent = `La IA no logró asociar la foto a ningún producto. Nombra el archivo con su código (Ejemplo: JOY-045.jpg).`;
            renderTabla([]); // Limpia la pantalla
          }
        };
      } else {
        // Encontrado por SKU exacto
        statusText.textContent = "¡PRODUCTO ENCONTRADO POR SKU!";
        statusText.className = "text-xs font-bold text-emerald-600 uppercase";
        matchDetail.textContent = `Mostrando ficha técnica del producto.`;
        renderTabla([coincidencia[0]]);
      }
    }

    // Limpiar filtro de la foto
    function limpiarFiltroImagen() {
      document.getElementById('image-preview-container').classList.add('hidden');
      document.getElementById('imageUploader').value = "";
      renderTabla(inventarioGlobal);
    }

    // Filtro manual por texto
    function filtrarTablaTexto() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderTabla(inventarioGlobal);
        return;
      }
      const filtrados = inventarioGlobal.filter(item => 
        Object.values(item).some(val => String(val).toLowerCase().includes(q))
      );
      renderTabla(filtrados);
    }

    // Cargar datos al abrir la página
    cargarDatos();
  </script>
</body>
</html>
