<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
      }
      td:hover {
        background-color: #f9f9f9;
      }
      .btn {
        padding: 6px 12px;
        margin-right: 5px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
      }
      .btn-primary { background-color: #0b57d0; color: white; }
      .btn-danger { background-color: #d93025; color: white; }
      .btn-sm { padding: 4px 8px; font-size: 12px; }
      .actions-header { width: 150px; }
    </style>
  </head>
  <body>
    <h2>Gestión de Hoja de Cálculo</h2>
    
    <!-- Controles principales -->
    <div>
      <button class="btn btn-primary" onclick="ejecutarAgregarFila()">+ Agregar Fila</button>
      <button class="btn btn-primary" onclick="ejecutarAgregarColumna()">+ Agregar Columna</button>
      <button class="btn" onclick="cargarTabla()">🔄 Recargar Datos</button>
    </div>

    <!-- Contenedor dinámico de la tabla -->
    <div id="tabla-container" style="margin-top: 20px;">Cargando datos...</div>

    <script>
      // Cargar la tabla al abrir la página
      window.onload = function() {
        cargarTabla();
      };

      function cargarTabla() {
        document.getElementById('tabla-container').innerHTML = "Cargando datos...";
        google.script.run
          .withSuccessHandler(renderizarTabla)
          .withFailureHandler(function(err) {
            alert("Error al obtener datos: " + err.message);
          })
          .obtenerDatos();
      }

      function renderizarTabla(datos) {
        if (!datos || datos.length === 0) {
          document.getElementById('tabla-container').innerHTML = "<p>La hoja de cálculo está vacía.</p>";
          return;
        }

        var html = "<table>";
        
        for (var i = 0; i < datos.length; i++) {
          html += "<tr>";
          
          for (var j = 0; j < datos[i].length; j++) {
            var esEncabezado = (i === 0);
            var tag = esEncabezado ? "th" : "td";
            var valor = datos[i][j] !== undefined ? datos[i][j] : "";
            
            // Doble clic en cualquier celda para editar su contenido
            html += `<${tag} ondblclick="editarCeldaDirecta(${i + 1}, ${j + 1}, '${valor}')" title="Doble clic para editar">
                      ${valor}
                    </${tag}>`;
          }
          
          // Columna de acciones por fila (Editar / Eliminar)
          if (i === 0) {
            html += "<th class='actions-header'>Acciones de Fila</th>";
          } else {
            html += `<td>
                      <button class="btn btn-danger btn-sm" onclick="eliminarFila(${i + 1})">Eliminar Fila</button>
                    </td>`;
          }
          
          html += "</tr>";
        }
        
        html += "</table>";
        html += "<p><small>💡 <em>Tip: Haz doble clic sobre cualquier celda para editar su valor.</em></small></p>";
        
        document.getElementById('tabla-container').innerHTML = html;
      }

      // --- FUNCIONES INTERACTIVAS CON EL SERVIDOR --- //

      function editarCeldaDirecta(fila, columna, valorActual) {
        var nuevoValor = prompt("Edita el valor de la celda (Fila " + fila + ", Columna " + columna + "):", valorActual);
        if (nuevoValor !== null && nuevoValor !== valorActual) {
          google.script.run
            .withSuccessHandler(cargarTabla)
            .editarCelda(fila, columna, nuevoValor);
        }
      }

      function eliminarFila(numFila) {
        if (confirm("¿Confirmas que deseas eliminar la fila número " + numFila + "?")) {
          google.script.run
            .withSuccessHandler(cargarTabla)
            .eliminarFila(numFila);
        }
      }

      function ejecutarAgregarFila() {
        var entrada = prompt("Ingresa los valores de la nueva fila separados por comas:");
        if (entrada) {
          var valores = entrada.split(',').map(item => item.trim());
          google.script.run
            .withSuccessHandler(cargarTabla)
            .agregarFila(valores);
        }
      }

      function ejecutarAgregarColumna() {
        var nombre = prompt("Nombre del encabezado de la nueva columna:");
        if (nombre) {
          google.script.run
            .withSuccessHandler(cargarTabla)
            .agregarColumna(nombre);
        }
      }
    </script>
  </body>
</html>
