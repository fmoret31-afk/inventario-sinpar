<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario SINPAR - Joyas</title>
  <!-- Tailwind CSS para diseño adaptable -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans text-gray-800">

  <div class="max-w-7xl mx-auto">
    <!-- Encabezado con buscador y estado de sincronización -->
    <header class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          <span>💎</span> Inventario SINPAR
        </h1>
        <p class="text-xs text-slate-500 mt-1 flex items-center gap-2">
          <span id="syncDot" class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span>
          Sincronizado en tiempo real con Google Sheets
        </p>
      </div>

      <div class="w-full md:w-1/2 flex gap-2">
        <input 
          type="text" 
          id="searchInput" 
          onkeyup="filterItems()" 
          placeholder="Buscar por SKU, nombre o categoría..." 
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        >
        <button onclick="loadInventory(true)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-sm font-semibold" title="Recargar manual">
          🔄
        </button>
      </div>
    </header>

    <!-- Estado de Carga -->
    <div id="loading" class="text-center py-16 bg-white rounded-xl shadow-sm border border-slate-200">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
      <p class="text-slate-600 font-medium">Cargando catálogo de joyas...</p>
    </div>

    <!-- Rejilla de Tarjetas -->
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </div>

  <!-- Modal de Edición de Producto -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800" id="modalTitle">Editar Producto</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>

      <form id="editForm" onsubmit="saveItem(event)">
        <input type="hidden" id="editSku">

        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre del Producto</label>
          <input type="text" id="editNombre" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoría</label>
          <input type="text" id="editCategoria" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Precio Venta (PEN)</label>
            <input type="text" id="editPrecio" placeholder="S/ 0.00" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Stock Actual</label>
            <input type="number" id="editStock" min="0" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="mb-5">
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Estado</label>
          <select id="editEstado" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Disponible">Disponible</option>
            <option value="Vendido">Vendido</option>
            <option value="Pendiente Precio">Pendiente Precio</option>
            <option value="No se encontró">No se encontró</option>
          </select>
        </div>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">Guardar en Sheets</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== PEGA AQUÍ LA URL COMPLETA DE TU DESPLIEGUE DE APPS SCRIPT =====
    const API_URL = "https://script.google.com/macros/s/AKfycbwNpwoPAzfFsUHlc1Lff7cmEdlrvoo15x3xHgvbrmWgvVL_77sZRbpWUR0mpZjChhJn/exec";

    let inventoryData = [];
    let isEditing = false;

    // Cargar datos desde Google Sheets
    async function loadInventory(showStatus = false) {
      if (isEditing) return; // Si estás editando en el modal, no interrumpir con la recarga

      try {
        if (showStatus) {
          document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-yellow-500 inline-block animate-ping";
        }

        const res = await fetch(API_URL);
        const data = await res.json();
        
        inventoryData = data;
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-green-500 inline-block";

        filterItems(); // Renderizar aplicando filtro activo si existe
      } catch (err) {
        console.error("Error cargando inventario:", err);
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-red-500 inline-block";
      }
    }

    // Dibujar las tarjetas en pantalla
    function renderCards(items) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">No se encontraron productos.</div>`;
        return;
      }

      items.forEach(item => {
        const sku = item["SKU / ID"] || "-";
        const nombre = item["Nombre del Producto"] || "Sin nombre";
        const categoria = item["Categoría"] || "Sin Categoría";
        const precio = item["Precio Venta (PEN)"] || "-";
        const estado = item["Estado"] || "Disponible";
        const imgUrl = item["Imagen_Directa"] || "https://via.placeholder.com/300x300?text=Sin+Imagen";

        const statusBg = estado === "Disponible" ? "bg-emerald-100 text-emerald-800" :
                         estado === "Vendido" ? "bg-amber-100 text-amber-800" : "bg-slate-100 text-slate-700";

        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-slate-200 p-4 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="relative w-full h-48 mb-3 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center">
              <img src="${imgUrl}" alt="${nombre}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x300?text=Foto+No+Disponible'">
              <span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-1 rounded-full ${statusBg}">
                ${estado}
              </span>
            </div>
            <span class="text-[11px] font-bold text-blue-600 uppercase tracking-wide">${categoria}</span>
            <h3 class="font-bold text-slate-800 text-sm mt-1 line-clamp-2">${nombre}</h3>
            <p class="text-xs text-slate-400 mt-1">SKU: <span class="font-mono text-slate-600">${sku}</span></p>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-[10px] text-slate-400">Precio</p>
              <p class="font-extrabold text-slate-800 text-base">${precio}</p>
            </div>
            <button onclick="openModal('${sku}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition-colors">
              ✏️ Editar
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Abrir ventana emergente con los datos del ítem seleccionado
    function openModal(sku) {
      const item = inventoryData.find(i => String(i["SKU / ID"]).trim() === String(sku).trim());
      if (!item) return;

      isEditing = true;
      document.getElementById("editSku").value = item["SKU / ID"] || "";
      document.getElementById("editNombre").value = item["Nombre del Producto"] || "";
      document.getElementById("editCategoria").value = item["Categoría"] || "";
      document.getElementById("editPrecio").value = item["Precio Venta (PEN)"] || "";
      document.getElementById("editStock").value = item["Stock Actual"] !== undefined ? item["Stock Actual"] : 1;
      document.getElementById("editEstado").value = item["Estado"] || "Disponible";

      document.getElementById("modalTitle").innerText = `Editar SKU: ${sku}`;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
      isEditing = false;
    }

    // Enviar datos modificados a Google Sheets
    async function saveItem(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.innerText = "Guardando en Sheets...";
      saveBtn.disabled = true;

      const payload = {
        "SKU / ID": document.getElementById("editSku").value,
        "Nombre del Producto": document.getElementById("editNombre").value,
        "Categoría": document.getElementById("editCategoria").value,
        "Precio Venta (PEN)": document.getElementById("editPrecio").value,
        "Stock Actual": document.getElementById("editStock").value,
        "Estado": document.getElementById("editEstado").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        closeModal();
        saveBtn.innerText = "Guardar en Sheets";
        saveBtn.disabled = false;
        
        // Cargar inmediatamente los datos actualizados
        await loadInventory(true);
      } catch (err) {
        alert("Ocurrió un error al intentar guardar los cambios.");
        console.error(err);
        saveBtn.innerText = "Guardar en Sheets";
        saveBtn.disabled = false;
      }
    }

    // Filtrar en tiempo real por buscador
    function filterItems() {
      const term = document.getElementById("searchInput").value.toLowerCase();
      const filtered = inventoryData.filter(i => {
        const nom = (i["Nombre del Producto"] || "").toLowerCase();
        const sku = (i["SKU / ID"] || "").toLowerCase();
        const cat = (i["Categoría"] || "").toLowerCase();
        return nom.includes(term) || sku.includes(term) || cat.includes(term);
      });
      renderCards(filtered);
    }

    // --- INICIALIZACIÓN Y AUTO-SINCRONIZACIÓN ---
    loadInventory();

    // Consultar cambios de la hoja de cálculo automáticamente cada 10 segundos
    setInterval(() => {
      loadInventory();
    }, 10000);
  </script>
</body>
</html>
