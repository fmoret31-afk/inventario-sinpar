<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"/>
  <title>SIN PAR · Joyería fina</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#121014',
            inksoft: '#221F24',
            ivory: '#F6F1E7',
            white: '#FFFFFF',
            champagne: '#F1E6CE',
            gold: '#A9822F',
            goldlight: '#D9C79C',
            stone: '#8B8378',
            textsec: '#6E675C',
            wine: '#6C2A32',
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --ink: #121014;
      --inksoft: #221F24;
      --ivory: #F6F1E7;
      --paper: #FFFFFF;
      --gold: #A9822F;
      --goldlight: #D9C79C;
      --goldpale: #F1E6CE;
      --stone: #8B8378;
      --textsec: #6E675C;
      --line: rgba(18,16,20,0.09);
      --line-gold: rgba(169,130,47,0.28);
      --green: #3C7A5C;
      --amber: #B07A2E;
      --red: #8C3B3B;
      --gray: #9C978D;
    }
    * { box-sizing: border-box; }
    .icon { width: 0.95em; height: 0.95em; display: inline-block; vertical-align: -0.14em; flex-shrink: 0; }
    .icon-spin { animation: icon-spin 0.9s linear infinite; }
    @keyframes icon-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--ivory);
      color: var(--ink);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--champagne); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

    a, button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .sidebar {
      position: fixed; top: 0; left: 0; width: 232px; height: 100vh;
      background: var(--ink);
      background-image: radial-gradient(circle at 50% -10%, rgba(169,130,47,0.14), transparent 55%);
      color: var(--champagne); z-index: 1000; padding: 2.4rem 1.6rem 1.6rem;
      display: flex; flex-direction: column; border-right: 1px solid rgba(169,130,47,0.16);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); overflow-y: auto;
    }
    .sidebar.collapsed { transform: translateX(-100%); }

    .sidebar-brand {
      margin-bottom: 2.8rem; padding-bottom: 1.7rem; border-bottom: 1px solid rgba(169,130,47,0.16);
      display: flex; align-items: center; gap: 0.85rem;
    }
    .brand-seal {
      flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; position: relative;
    }
    .brand-seal::before {
      content: ''; position: absolute; inset: 4px; border: 1px solid rgba(169,130,47,0.35); border-radius: 50%;
    }
    .brand-seal span { font-family: 'Fraunces', serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em; color: var(--goldlight); }
    .sidebar-brand h1 { font-family: 'Fraunces', serif; font-size: 1.45rem; font-weight: 600; letter-spacing: 0.03em; color: var(--ivory); margin: 0; line-height: 1.05; }
    .sidebar-brand h1 span { color: var(--gold); font-style: italic; font-weight: 500; }
    .sidebar-brand .sub { font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--stone); margin-top: 0.3rem; display: block; font-weight: 400; }

    .sidebar-nav { flex: 1; margin-top: 0.4rem; }
    .sidebar-nav .nav-item {
      display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 2px;
      color: var(--stone); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
      border: none; background: transparent; width: 100%; text-align: left; position: relative;
      font-family: 'Inter', sans-serif; letter-spacing: 0.02em;
    }
    .sidebar-nav .nav-item i { width: 1.1rem; font-size: 0.85rem; color: rgba(232,221,202,0.4); transition: color 0.2s; }
    .sidebar-nav .nav-item:hover { color: var(--champagne); background: rgba(169,130,47,0.06); }
    .sidebar-nav .nav-item:hover i { color: var(--gold); }
    .sidebar-nav .nav-item.active { color: var(--ivory); background: rgba(169,130,47,0.05); }
    .sidebar-nav .nav-item.active i { color: var(--gold); }
    .sidebar-nav .nav-item.active::before { content: ''; position: absolute; left: -1.6rem; top: 50%; transform: translateY(-50%); width: 2px; height: 62%; background: var(--gold); }
    .sidebar-nav .nav-item .badge-pend { margin-left: auto; background: rgba(169,130,47,0.16); color: var(--goldlight); font-size: 0.58rem; padding: 0.08rem 0.5rem; border-radius: 999px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }

    .sidebar-footer { font-family: 'Fraunces', serif; font-style: italic; font-size: 0.65rem; color: rgba(232,221,202,0.35); border-top: 1px solid rgba(169,130,47,0.12); padding-top: 1.1rem; text-align: center; letter-spacing: 0.04em; }

    .main-content { margin-left: 232px; padding: 2.2rem 3rem 3rem; min-height: 100vh; transition: margin 0.35s cubic-bezier(0.4,0,0.2,1); background: var(--ivory); }
    .main-content.expanded { margin-left: 0; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line); margin-bottom: 2.2rem; }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .menu-toggle { background: transparent; border: none; color: var(--textsec); font-size: 1.15rem; cursor: pointer; padding: 0.25rem; display: none; }
    .topbar-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
    .topbar-right { display: flex; align-items: center; gap: 1.1rem; }

    .search-box { position: relative; display: flex; align-items: center; }
    .search-box i { position: absolute; left: 0.9rem; font-size: 0.75rem; color: var(--stone); pointer-events: none; }
    .search-box input { width: 220px; padding: 0.42rem 0.9rem 0.42rem 2.1rem; border: 1px solid var(--line-gold); border-radius: 999px; background: var(--paper); font-size: 0.75rem; font-family: 'Inter', sans-serif; color: var(--ink); outline: none; transition: all 0.2s; }
    .search-box input::placeholder { color: var(--stone); }
    .search-box input:focus { border-color: var(--gold); width: 260px; box-shadow: 0 0 0 3px rgba(169,130,47,0.08); }

    .sync-status { font-size: 0.68rem; color: var(--textsec); display: flex; align-items: center; gap: 0.5rem; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); display: inline-block; }
    .sync-dot.pulse { animation: pulse 1.6s infinite; }
    .sync-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .btn-refresh { background: transparent; border: 1px solid var(--line-gold); padding: 0.32rem 0.9rem; border-radius: 999px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.03em; color: var(--textsec); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.45rem; }
    .btn-refresh:hover { background: var(--goldpale); border-color: var(--gold); color: var(--ink); }

    .tab-content { display: none; animation: fadeIn 0.35s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 2.6rem; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; }
    .kpi-item { padding: 1.15rem 1.5rem; border-left: 1px solid var(--line); }
    .kpi-item:first-child { border-left: none; }
    .kpi-item .label { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--stone); font-weight: 500; }
    .kpi-item .value { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600; color: var(--ink); margin-top: 0.15rem; }

    .table-wrapper { background: var(--paper); border-radius: 2px; border: 1px solid var(--line); overflow: hidden; margin-top: 1rem; }
    .table-wrapper table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .table-wrapper th { background: var(--ivory); color: var(--textsec); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.6rem; padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; }
    .table-wrapper td { padding: 0.65rem 0.9rem; border-bottom: 1px solid rgba(18,16,20,0.05); vertical-align: middle; color: var(--ink); }
    .table-wrapper tr:hover td { background: var(--goldpale); }

    .btn-action { background: transparent; border: 1px solid var(--line-gold); border-radius: 999px; padding: 0.2rem 0.65rem; font-size: 0.62rem; font-weight: 500; color: var(--textsec); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.35rem; }
    .btn-action:hover { background: var(--goldpale); border-color: var(--gold); color: var(--ink); }
    .btn-action.sell { border-color: var(--ink); background: var(--ink); color: var(--ivory); }
    .btn-action.sell:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }

    #toast { visibility: hidden; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ivory); padding: 0.85rem 1.9rem; border-radius: 999px; font-size: 0.85rem; box-shadow: 0 10px 40px rgba(0,0,0,0.28); border: 1px solid var(--line-gold); z-index: 3000; opacity: 0; transition: opacity 0.3s, visibility 0.3s; font-family: 'Inter', sans-serif; }
    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>
<body>

  <div id="toast"><span id="toastMessage">Operación exitosa</span></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-seal"><span>SP</span></div>
      <div>
        <h1>SIN <span>Par</span></h1>
        <span class="sub">Joyería fina</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="switchTab('inicio')">Inicio</button>
      <button class="nav-item" onclick="switchTab('coleccion')">Colección</button>
      <button class="nav-item" onclick="switchTab('ventas')">Ventas</button>
    </nav>
    <div class="sidebar-footer">Maison SIN PAR</div>
  </aside>

  <div class="main-content" id="mainContent">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="pageTitle">Inicio</span>
      </div>
      <div class="topbar-right">
        <div class="sync-status">
          <span class="sync-dot pulse" id="syncDot"></span>
          <span id="syncStatus">Sincronizando con Google Sheets...</span>
        </div>
        <button class="btn-refresh" onclick="cargarDatos()"><svg id="btn-refresh-icon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8 8 0 1 0 19 15"/><path d="M20 5v6h-6"/></svg> Actualizar</button>
      </div>
    </div>

    <div id="pageContent">
      <div id="tab-inicio" class="tab-content active">
        <div class="kpis">
          <div class="kpi-item"><div class="label">Piezas</div><div class="value" id="kpi-total-items">0</div></div>
          <div class="kpi-item"><div class="label">Stock Total</div><div class="value" id="kpi-total-stock">0 u.</div></div>
          <div class="kpi-item"><div class="label">Valor Inventario</div><div class="value" id="kpi-total-valor">S/ 0.00</div></div>
          <div class="kpi-item"><div class="label">Estado API</div><div class="value" style="font-size:1rem; margin-top:0.5rem;" id="kpi-api-status">Conectado</div></div>
        </div>

        <div class="table-wrapper">
          <div style="padding:0.9rem 1.1rem; border-bottom:1px solid var(--line);">
            <span style="font-family:'Fraunces',serif; font-weight:600;">Inventario en Tiempo Real</span>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Precio (S/)</th>
                  <th>Stock</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="inventoryTable">
                <tr><td colspan="6" class="text-center py-6 text-stone">Cargando datos desde la hoja de cálculo...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL del Web App de Google Apps Script vinculado a la Hoja de Cálculo
    const API_URL = "https://script.google.com/macros/s/AKfycbwAVyNP4DO01oo6gVcrha_r1SY4rpX0GMuEBwpgMhiqNPc794HfSMDxvEN6LKW1uBgY/exec";
    let inventario = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Consulta de datos en Google Sheets (GET)
    async function cargarDatos() {
      const dot = document.getElementById('syncDot');
      const status = document.getElementById('syncStatus');
      if (status) status.textContent = 'Leyendo Google Sheets…';
      if (dot) { dot.classList.remove('error'); dot.classList.add('pulse'); }

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error('Error al conectar con la API');
        const data = await resp.json();

        inventario = data.map(item => ({
          sku: item.sku || item["SKU / ID"] || '',
          categoria: item.categoria || item["Categoría"] || '',
          nombre: item.nombre || item["Nombre del Producto"] || '',
          precio: parseFloat(item.precio || item["Precio Venta (PEN)"] || 0),
          stockActual: parseInt(item.stockActual || item["Stock Actual"] || 0)
        }));

        renderTabla();
        actualizarKPIs();
        if (status) status.textContent = 'Sincronizado con Google Sheets';
        if (dot) dot.classList.remove('pulse');
      } catch (err) {
        console.error(err);
        showToast('Error de conexión con la hoja de cálculo');
        if (status) status.textContent = 'Error de Sincronización';
        if (dot) { dot.classList.remove('pulse'); dot.classList.add('error'); }
      }
    }

    // Envío de actualizaciones a Google Sheets (POST)
    async function actualizarEnHojaCalculo(payload) {
      const status = document.getElementById('syncStatus');
      if (status) status.textContent = 'Guardando en Google Sheets…';
      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast('Cambios guardados en Google Sheets');
        if (status) status.textContent = 'Sincronizado';
      } catch (err) {
        console.error(err);
        showToast('Error al intentar guardar los datos');
        if (status) status.textContent = 'Error al guardar';
      }
    }

    function renderTabla() {
      const tbody = document.getElementById('inventoryTable');
      if (!inventario || inventario.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-stone">No se encontraron registros</td></tr>`;
        return;
      }
      tbody.innerHTML = inventario.map(p => `
        <tr>
          <td><span class="font-mono text-xs">${p.sku}</span></td>
          <td>
            <input type="text" class="bg-transparent border-b border-dashed border-stone-400 focus:border-solid focus:border-amber-600 outline-none w-full" 
                   value="${p.nombre}" onchange="guardarEdicionNombre('${p.sku}', this.value)">
          </td>
          <td>${p.categoria}</td>
          <td class="font-bold text-amber-700">S/ ${p.precio.toFixed(2)}</td>
          <td>${p.stockActual}</td>
          <td>
            <button class="btn-action sell" onclick="registrarVenta('${p.sku}')">Registrar Venta</button>
          </td>
        </tr>
      `).join('');
    }

    function actualizarKPIs() {
      let totalStock = 0, totalValor = 0;
      inventario.forEach(p => {
        totalStock += p.stockActual;
        totalValor += p.stockActual * p.precio;
      });
      document.getElementById('kpi-total-items').textContent = inventario.length;
      document.getElementById('kpi-total-stock').textContent = `${totalStock} u.`;
      document.getElementById('kpi-total-valor').textContent = `S/ ${totalValor.toFixed(2)}`;
    }

    function guardarEdicionNombre(sku, nuevoNombre) {
      const item = inventario.find(i => i.sku === sku);
      if (item) {
        item.nombre = nuevoNombre;
        actualizarEnHojaCalculo({ accion: 'editar', sku: sku, nombre: nuevoNombre });
      }
    }

    function registrarVenta(sku) {
      const item = inventario.find(i => i.sku === sku);
      if (item && item.stockActual > 0) {
        item.stockActual -= 1;
        renderTabla();
        actualizarKPIs();
        actualizarEnHojaCalculo({ accion: 'venta', sku: sku, nuevoStock: item.stockActual });
      } else {
        showToast('Sin stock disponible');
      }
    }

    function switchTab(tab) {
      document.getElementById('pageTitle').textContent = tab.charAt(0).toUpperCase() + tab.slice(1);
    }

    // Inicialización al cargar la pantalla
    window.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
</body>
</html>
