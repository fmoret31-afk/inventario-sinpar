<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario SINPAR - Joyas</title>
  <!-- Tailwind CSS para diseño adaptable -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans text-gray-800">

  <div class="max-w-7xl mx-auto">
    <!-- Encabezado con buscador, filtro, controles y botones de acción -->
    <header class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          <span>💎</span> Inventario SINPAR
        </h1>
        <p class="text-xs text-slate-500 mt-1 flex items-center gap-2">
          <span id="syncDot" class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span>
          Sincronizado en tiempo real con Google Sheets
        </p>
      </div>

      <div class="w-full md:w-3/4 flex flex-col sm:flex-row gap-2">
        <!-- Buscador general -->
        <input 
          type="text" 
          id="searchInput" 
          onkeyup="filterItems()" 
          placeholder="Buscar SKU, nombre, comprador..." 
          class="w-full sm:w-1/3 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        >

        <!-- Filtro por Categoría -->
        <select 
          id="categoryFilter" 
          onchange="filterItems()" 
          class="w-full sm:w-1/4 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white text-slate-700 font-medium"
        >
          <option value="">Todas las Categorías</option>
        </select>
        
        <!-- Botón Nuevo Producto -->
        <button onclick="openNewModal()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm flex items-center justify-center gap-1 transition-colors shrink-0">
          <span>➕</span> Nuevo
        </button>

        <!-- Botones de Cambio de Vista -->
        <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200 shrink-0">
          <button id="btnViewGrid" onclick="switchView('grid')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-slate-700 bg-white shadow-sm transition-all">
            📱 Tarjetas
          </button>
          <button id="btnViewTable" onclick="switchView('table')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all">
            📊 Tabla
          </button>
        </div>

        <button onclick="loadInventory(true)" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-sm font-semibold shrink-0" title="Recargar manual">
          🔄
        </button>
      </div>
    </header>

    <!-- Estado de Carga -->
    <div id="loading" class="text-center py-16 bg-white rounded-xl shadow-sm border border-slate-200">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
      <p class="text-slate-600 font-medium">Cargando catálogo de joyas...</p>
    </div>

    <!-- Vista 1: Rejilla de Tarjetas -->
    <div id="gridView" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Vista 2: Tabla Horizontal completa con Scroll -->
    <div id="tableView" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto max-h-[75vh]">
        <table class="w-full text-xs text-left border-collapse">
          <thead class="bg-slate-100 text-slate-700 font-bold uppercase sticky top-0 border-b border-slate-200 z-10">
            <tr>
              <th class="p-3">Acción</th>
              <th class="p-3">Foto</th>
              <th class="p-3">SKU / ID</th>
              <th class="p-3">Nombre del Producto</th>
              <th class="p-3">Categoría</th>
              <th class="p-3">Precio Venta</th>
              <th class="p-3 text-center">Stock Act.</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Comprado Por</th>
              <th class="p-3">Proveedor</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Completo de Crear / Editar Producto -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h2 class="text-lg font-bold text-slate-800" id="modalTitle">Editar Producto</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>

      <form id="editForm" onsubmit="saveItem(event)">
        <!-- Vista previa de imagen e inputs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div class="flex flex-col items-center justify-center bg-slate-50 p-3 rounded-xl border">
            <img id="editImgPreview" src="" class="w-32 h-32 object-cover rounded-lg mb-2 bg-white border" onerror="this.src='https://via.placeholder.com/150?text=Sin+Foto'">
            <span class="text-[10px] text-slate-400 text-center">Vista previa de imagen</span>
          </div>

          <div class="md:col-span-2 space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">SKU / ID</label>
                <input type="text" id="editSku" class="w-full border rounded-lg p-2 text-sm font-mono focus:ring-2 focus:ring-blue-500" required>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoría</label>
                <input type="text" id="editCategoria" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre del Producto</label>
              <input type="text" id="editNombre" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Enlace Imagen (Google Drive)</label>
              <input type="url" id="editImagen" oninput="updatePreviewImage(this.value)" class="w-full border rounded-lg p-2 text-xs font-mono focus:ring-2 focus:ring-blue-500" placeholder="https://drive.google.com/file/d/...">
            </div>
          </div>
        </div>

        <!-- Precios, Estados, Comprador y Proveedor -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Precio Venta (PEN)</label>
            <input type="text" id="editPrecio" placeholder="S/ 0.00" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Estado</label>
            <select id="editEstado" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="Disponible">Disponible</option>
              <option value="Vendido">Vendido</option>
              <option value="Pendiente Precio">Pendiente Precio</option>
              <option value="No se encontró">No se encontró</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-blue-700 uppercase mb-1">Comprado por (Cliente)</label>
            <input type="text" id="editComprador" placeholder="Nombre del cliente..." class="w-full border border-blue-200 rounded-lg p-2 text-sm bg-blue-50/30 focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Proveedor</label>
            <input type="text" id="editProveedor" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Control de Stocks -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-5">
          <span class="block text-xs font-bold text-slate-700 uppercase mb-2">Control de Inventario</span>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-slate-500">Stock Inic.</label>
              <input type="number" id="editStockInicial" min="0" class="w-full border rounded-lg p-1.5 text-xs">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500">Entradas</label>
              <input type="number" id="editEntradas" min="0" class="w-full border rounded-lg p-1.5 text-xs">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500">Salidas</label>
              <input type="number" id="editSalidas" min="0" class="w-full border rounded-lg p-1.5 text-xs">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-blue-600">Stock Actual</label>
              <input type="number" id="editStockActual" min="0" class="w-full border rounded-lg p-1.5 text-xs bg-blue-50 font-bold text-blue-700">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500">Stock Mín.</label>
              <input type="number" id="editStockMinimo" min="0" class="w-full border rounded-lg p-1.5 text-xs">
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-slate-600 text-sm font-semibold hover:bg-slate-50">Cancelar</button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">Guardar en Sheets</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyabkbwniP58-c-MAt8veLA1qY_sfMmTgcfYj5CpxRNVkamUO8nhdbOuL831-8KQW-/exec";

    let inventoryData = [];
    let isEditing = false;
    let currentView = "grid";

    function switchView(view) {
      currentView = view;
      const btnGrid = document.getElementById("btnViewGrid");
      const btnTable = document.getElementById("btnViewTable");
      const gridView = document.getElementById("gridView");
      const tableView = document.getElementById("tableView");

      if (view === "grid") {
        gridView.classList.remove("hidden");
        tableView.classList.add("hidden");
        btnGrid.className = "px-3 py-1.5 rounded-md text-xs font-semibold text-slate-700 bg-white shadow-sm transition-all";
        btnTable.className = "px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all";
      } else {
        gridView.classList.add("hidden");
        tableView.classList.remove("hidden");
        btnTable.className = "px-3 py-1.5 rounded-md text-xs font-semibold text-slate-700 bg-white shadow-sm transition-all";
        btnGrid.className = "px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all";
      }
      filterItems();
    }

    async function loadInventory(showStatus = false) {
      if (isEditing) return;

      try {
        if (showStatus) {
          document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-yellow-500 inline-block animate-ping";
        }

        const res = await fetch(API_URL);
        const data = await res.json();
        
        inventoryData = data;
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-green-500 inline-block";

        updateCategoryDropdown();
        filterItems();
      } catch (err) {
        console.error("Error cargando inventario:", err);
        document.getElementById("syncDot").className = "w-2 h-2 rounded-full bg-red-500 inline-block";
      }
    }

    function updateCategoryDropdown() {
      const categorySelect = document.getElementById("categoryFilter");
      const currentSelected = categorySelect.value;

      const categories = [...new Set(
        inventoryData
          .map(item => item["Categoría"])
          .filter(cat => cat && cat.trim() !== "")
      )].sort();

      categorySelect.innerHTML = `<option value="">Todas las Categorías (${inventoryData.length})</option>`;
      
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        if (cat === currentSelected) option.selected = true;
        categorySelect.appendChild(option);
      });
    }

    // Renderizar Tarjetas
    function renderCards(items) {
      const grid = document.getElementById("gridView");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">No se encontraron productos.</div>`;
        return;
      }

      items.forEach(item => {
        const sku = item["SKU / ID"] || "-";
        const nombre = item["Nombre del Producto"] || "Sin nombre";
        const categoria = item["Categoría"] || "Sin Categoría";
        const precio = item["Precio Venta (PEN)"] || "-";
        const estado = item["Estado"] || "Disponible";
        const comprador = item["Comprado por"] || item["Comprador"] || "";
        const stockActual = Number(item["Stock Actual"] ?? 1);
        const imgUrl = item["Imagen_Directa"] || "https://via.placeholder.com/300x300?text=Sin+Imagen";

        // Determinar si el activo ya no se tiene
        const isOut = stockActual <= 0 || estado === "Vendido" || estado === "No se encontró";
        
        const cardBg = isOut ? "bg-red-50/60 border-red-200" : "bg-white border-slate-200";
        const imgFilter = isOut ? "grayscale opacity-75" : "";
        const statusBg = isOut ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800";

        const card = document.createElement("div");
        card.className = `${cardBg} rounded-xl shadow-sm hover:shadow-md transition-all border p-4 flex flex-col justify-between`;
        card.innerHTML = `
          <div>
            <div class="relative w-full h-48 mb-3 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center">
              <img src="${imgUrl}" alt="${nombre}" class="w-full h-full object-cover ${imgFilter}" onerror="this.src='https://via.placeholder.com/300x300?text=Foto+No+Disponible'">
              <span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-1 rounded-full ${statusBg}">
                ${isOut && stockActual <= 0 ? 'Sin Stock' : estado}
              </span>
            </div>
            <span class="text-[11px] font-bold text-blue-600 uppercase tracking-wide">${categoria}</span>
            <h3 class="font-bold text-slate-800 text-sm mt-1 line-clamp-2">${nombre}</h3>
            <p class="text-xs text-slate-400 mt-1">SKU: <span class="font-mono text-slate-600">${sku}</span></p>

            ${comprador ? `<p class="mt-2 text-xs font-semibold text-purple-700 bg-purple-50 px-2 py-1 rounded-md border border-purple-100">👤 Comprado por: ${comprador}</p>` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div>
              <p class="text-[10px] text-slate-400">Precio</p>
              <p class="font-extrabold text-slate-800 text-base">${precio}</p>
            </div>
            <button onclick="openModal('${sku}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition-colors">
              ✏️ Editar
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Renderizar Tabla
    function renderTable(items) {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = "";

      if (items.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-slate-400">No se encontraron productos.</td></tr>`;
        return;
      }

      items.forEach(item => {
        const sku = item["SKU / ID"] || "-";
        const nombre = item["Nombre del Producto"] || "Sin nombre";
        const categoria = item["Categoría"] || "-";
        const precio = item["Precio Venta (PEN)"] || "-";
        const stockActual = Number(item["Stock Actual"] ?? 1);
        const estado = item["Estado"] || "Disponible";
        const comprador = item["Comprado por"] || item["Comprador"] || "-";
        const proveedor = item["Proveedor"] || "-";
        const imgUrl = item["Imagen_Directa"] || "https://via.placeholder.com/50";

        const isOut = stockActual <= 0 || estado === "Vendido" || estado === "No se encontró";
        const rowBg = isOut ? "bg-red-50/70 hover:bg-red-100/70" : "hover:bg-slate-50";
        const statusBg = isOut ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800";

        const tr = document.createElement("tr");
        tr.className = `${rowBg} transition-colors border-b border-slate-100`;
        tr.innerHTML = `
          <td class="p-3">
            <button onclick="openModal('${sku}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white text-[11px] font-semibold rounded transition-colors whitespace-nowrap">
              ✏️ Editar
            </button>
          </td>
          <td class="p-3">
            <img src="${imgUrl}" class="w-10 h-10 object-cover rounded border bg-slate-100 ${isOut ? 'grayscale' : ''}" onerror="this.src='https://via.placeholder.com/50?text=x'">
          </td>
          <td class="p-3 font-mono font-bold text-slate-700 whitespace-nowrap">${sku}</td>
          <td class="p-3 font-semibold text-slate-800 max-w-[200px] truncate" title="${nombre}">${nombre}</td>
          <td class="p-3 text-slate-600 whitespace-nowrap">${categoria}</td>
          <td class="p-3 font-bold text-slate-800 whitespace-nowrap">${precio}</td>
          <td class="p-3 text-center font-bold ${isOut ? 'text-red-600 font-black' : 'text-blue-700'}">${stockActual}</td>
          <td class="p-3 whitespace-nowrap">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusBg}">${estado}</span>
          </td>
          <td class="p-3 text-purple-800 font-semibold whitespace-nowrap">${comprador}</td>
          <td class="p-3 text-slate-500 whitespace-nowrap">${proveedor}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    // Abrir Modal para crear Nuevo Producto
    function openNewModal() {
      isEditing = true;
      document.getElementById("modalTitle").innerText = "➕ Nuevo Producto";
      document.getElementById("editSku").value = "SKU-" + Math.floor(1000 + Math.random() * 9000);
      document.getElementById("editSku").readOnly = false;
      document.getElementById("editNombre").value = "";
      document.getElementById("editCategoria").value = "";
      document.getElementById("editImagen").value = "";
      document.getElementById("editPrecio").value = "S/ 0.00";
      document.getElementById("editStockInicial").value = 1;
      document.getElementById("editEntradas").value = 0;
      document.getElementById("editSalidas").value = 0;
      document.getElementById("editStockActual").value = 1;
      document.getElementById("editStockMinimo").value = 1;
      document.getElementById("editEstado").value = "Disponible";
      document.getElementById("editComprador").value = "";
      document.getElementById("editProveedor").value = "";
      document.getElementById("editImgPreview").src = "https://via.placeholder.com/150?text=Nueva+Imagen";

      document.getElementById("editModal").classList.remove("hidden");
    }

    // Abrir Modal para Editar Producto
    function openModal(sku) {
      const item = inventoryData.find(i => String(i["SKU / ID"]).trim() === String(sku).trim());
      if (!item) return;

      isEditing = true;
      document.getElementById("modalTitle").innerText = `Editar Producto: ${sku}`;
      document.getElementById("editSku").value = item["SKU / ID"] || "";
      document.getElementById("editSku").readOnly = true;
      document.getElementById("editNombre").value = item["Nombre del Producto"] || "";
      document.getElementById("editCategoria").value = item["Categoría"] || "";
      document.getElementById("editImagen").value = item["Imagen"] || "";
      document.getElementById("editPrecio").value = item["Precio Venta (PEN)"] || "";
      document.getElementById("editStockInicial").value = item["Stock Inicial"] ?? "";
      document.getElementById("editEntradas").value = item["Entradas"] ?? "";
      document.getElementById("editSalidas").value = item["Salidas"] ?? "";
      document.getElementById("editStockActual").value = item["Stock Actual"] ?? "";
      document.getElementById("editStockMinimo").value = item["Stock Mínimo"] ?? "";
      document.getElementById("editEstado").value = item["Estado"] || "Disponible";
      document.getElementById("editComprador").value = item["Comprado por"] || item["Comprador"] || "";
      document.getElementById("editProveedor").value = item["Proveedor"] || "";

      document.getElementById("editImgPreview").src = item["Imagen_Directa"] || "https://via.placeholder.com/150";

      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
      isEditing = false;
    }

    function updatePreviewImage(url) {
      if (url.includes("drive.google.com")) {
        const idMatch = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
        if (idMatch && idMatch[1]) {
          url = `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
        }
      }
      document.getElementById("editImgPreview").src = url || 'https://via.placeholder.com/150';
    }

    // Guardar o Crear Producto en Google Sheets
    async function saveItem(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.innerText = "Guardando...";
      saveBtn.disabled = true;

      const payload = {
        "SKU / ID": document.getElementById("editSku").value,
        "Imagen": document.getElementById("editImagen").value,
        "Nombre del Producto": document.getElementById("editNombre").value,
        "Categoría": document.getElementById("editCategoria").value,
        "Precio Venta (PEN)": document.getElementById("editPrecio").value,
        "Stock Inicial": document.getElementById("editStockInicial").value,
        "Entradas": document.getElementById("editEntradas").value,
        "Salidas": document.getElementById("editSalidas").value,
        "Stock Actual": document.getElementById("editStockActual").value,
        "Stock Mínimo": document.getElementById("editStockMinimo").value,
        "Estado": document.getElementById("editEstado").value,
        "Comprado por": document.getElementById("editComprador").value,
        "Proveedor": document.getElementById("editProveedor").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        closeModal();
        saveBtn.innerText = "Guardar en Sheets";
        saveBtn.disabled = false;
        
        await loadInventory(true);
      } catch (err) {
        alert("Ocurrió un error al intentar guardar los cambios.");
        console.error(err);
        saveBtn.innerText = "Guardar en Sheets";
        saveBtn.disabled = false;
      }
    }

    // Filtro de texto y categoría
    function filterItems() {
      const term = document.getElementById("searchInput").value.toLowerCase();
      const selectedCategory = document.getElementById("categoryFilter").value;

      const filtered = inventoryData.filter(i => {
        const nom = (i["Nombre del Producto"] || "").toLowerCase();
        const sku = (i["SKU / ID"] || "").toLowerCase();
        const cat = i["Categoría"] || "";
        const est = (i["Estado"] || "").toLowerCase();
        const prov = (i["Proveedor"] || "").toLowerCase();
        const comp = (i["Comprado por"] || i["Comprador"] || "").toLowerCase();

        const matchesSearch = nom.includes(term) || sku.includes(term) || cat.toLowerCase().includes(term) || est.includes(term) || prov.includes(term) || comp.includes(term);
        const matchesCategory = selectedCategory === "" || cat === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      if (currentView === "grid") {
        renderCards(filtered);
      } else {
        renderTable(filtered);
      }
    }

    loadInventory();
    setInterval(() => {
      loadInventory();
    }, 10000);
  </script>
</body>
</html>
